{% extends "app/base.html" %}
{% load static %}
{% block title %}Join House — KnowWatt{% endblock %}
{% block nav_houses %}active{% endblock %}

{% block content %}
<div class="page active">
  <div class="center-panel">
    <div class="top-bar">
      <div>
        <div class="top-bar-title">Join House</div>
        <div class="top-bar-sub">Enter a join code from an existing house</div>
      </div>
    </div>
    <div class="dashboard-content">
      <div style="max-width:400px;">
        <form method="post">
          {% csrf_token %}
          <div style="margin-bottom:14px;">
            <label style="display:block; font-size:11px; font-weight:500; color:var(--text2); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px;">Join Code</label>
            <input type="text" name="join_code" maxlength="8" placeholder="e.g. A1B2C3D4" required
              style="width:100%; padding:10px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:14px; font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:2px; outline:none;"
              onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
          </div>
          <div style="display:flex; gap:10px; margin-top:20px;">
            <a href="{% url 'page-house-list' %}" style="flex:1; padding:10px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text2); font-size:13px; font-weight:500; text-align:center; text-decoration:none;">Cancel</a>
            <button type="submit" style="flex:2; padding:10px; background:var(--accent); border:none; border-radius:10px; color:#000; font-size:13px; font-weight:600; cursor:pointer;">Join House</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
