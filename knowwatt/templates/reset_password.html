{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — KnowWatt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/home/home.css' %}">
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #121215;
      --border: #232328;
      --accent: #00f2ff;
      --accent-dim: rgba(0, 242, 255, 0.1);
      --text: #ffffff;
      --text-muted: #888891;
      --danger: #f87171;
    }
    body { 
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .auth-wrap { width: 100%; max-width: 400px; padding: 24px; }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      animation: fadeUp .5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-logo {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 32px;
    }
    .auth-logo-icon {
      width: 40px; height: 40px;
      background: var(--accent-dim);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
    }
    .auth-logo-name { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .auth-headline { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .auth-subhead  { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 32px; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 11px; font-weight: 600; color: var(--text-muted);
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-control {
      width: 100%; padding: 12px 16px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 14px;
      font-family: inherit; outline: none; box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .form-control::placeholder { color: #333; }
    
    .msg-error { font-size: 12px; color: var(--danger); margin: 12px 0; text-align: center; background: rgba(248, 113, 113, 0.1); padding: 10px; border-radius: 8px; }
    .msg-notice { font-size: 12px; color: var(--accent); margin: 12px 0; text-align: center; background: var(--accent-dim); padding: 10px; border-radius: 8px; }
    
    .btn-primary {
      width: 100%; padding: 14px;
      background: var(--accent); color: #000;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 10px;
      transition: transform 0.2s;
    }
    .btn-primary:hover { transform: scale(1.02); filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .auth-footer { margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-muted); }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <span class="auth-logo-name">KnowWatt</span>
    </div>

    <h1 class="auth-headline">New password</h1>
    <p class="auth-subhead">Choose a strong password for your account</p>

    <form method="post" action="{% url 'reset_password' %}">
      {% csrf_token %}
      <input type="hidden" name="token" id="token" value="">
      <div class="form-group">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" class="form-control" placeholder="Enter new password" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" class="form-control" placeholder="Confirm new password" autocomplete="new-password" required>
      </div>

      {% if error %}
        <div class="msg-error">{{ error }}</div>
      {% endif %}
      {% if message %}
        <div class="msg-notice">{{ message }}</div>
      {% endif %}

      <button type="submit" class="btn-primary" id="submit-btn">Set New Password</button>
    </form>

    <div class="auth-footer">
      <a href="/login/">← Back to sign in</a>
    </div>

  </div>
</div>

<script>
  // Extract token from URL and populate hidden input
  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token');
  if (token) {
    document.getElementById('token').value = token;
  }
</script>
</body>
</html>
