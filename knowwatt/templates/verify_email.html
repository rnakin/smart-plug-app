{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — KnowWatt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/home/home.css' %}">
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #121215;
      --border: #232328;
      --accent: #00f2ff;
      --accent-dim: rgba(0, 242, 255, 0.1);
      --text: #ffffff;
      --text-muted: #888891;
      --danger: #f87171;
    }
    body { 
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .auth-wrap { width: 100%; max-width: 400px; padding: 24px; }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      animation: fadeUp .5s cubic-bezier(0.16, 1, 0.3, 1) both;
      text-align: center;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .auth-headline { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .auth-subhead  { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
    
    .state-icon {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .state-icon.loading {
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      background: transparent;
    }
    .state-icon.success { background: var(--accent-dim); color: var(--accent); }
    .state-icon.error   { background: rgba(248, 113, 113, 0.1); color: var(--danger); }
    
    .btn-primary {
      display: block; width: 100%; padding: 14px;
      background: var(--accent); color: #000;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 32px;
      text-align: center; text-decoration: none;
      transition: transform 0.2s;
    }
    .btn-primary:hover { transform: scale(1.02); filter: brightness(1.1); }
    
    .auth-footer { margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-muted); }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card" id="verify-card">

    {% if message %}
      <!-- Success state -->
      <div>
        <div class="state-icon success">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h1 class="auth-headline">Email verified!</h1>
        <p class="auth-subhead">{{ message }}</p>
        <a href="/auth/login/" class="btn-primary">Sign In</a>
      </div>
    {% elif error %}
      <!-- Error state -->
      <div>
        <div class="state-icon error">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
        </div>
        <h1 class="auth-headline">Verification failed</h1>
        <p class="auth-subhead">{{ error }}</p>
        <a href="/auth/login/" class="btn-primary">Back to Sign In</a>
      </div>
    {% else %}
      <!-- Loading state -->
      <div>
        <div class="state-icon loading"></div>
        <p class="auth-subhead">Verifying your email…</p>
      </div>
    {% endif %}

  </div>
</div>
</body>
</html>
